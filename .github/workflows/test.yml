name: Test

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Auto Merge"]
    types:
      - completed
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    # Security: Explicit permissions - only what's needed
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: "x64"
          cache: pnpm

      - name: Install
        run: pnpm install -w

      - name: Test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Trigger E2E Tests (After Version Bump, Auto Merge, or Push to Main)
        if: success() && (github.event_name == 'workflow_run' || github.event_name == 'push')
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Triggering E2E Tests workflow after push to main..."
            HEAD_REF="main"
          else
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
            echo "Triggering E2E Tests workflow after $WORKFLOW_NAME..."

            # Get the head ref from the workflow run event
            HEAD_REF="${{ github.event.workflow_run.head_branch }}"
            echo "Triggering E2E tests for branch: $HEAD_REF"

            # For Auto Merge, always use main branch
            if [ "$WORKFLOW_NAME" = "Auto Merge" ]; then
              HEAD_REF="main"
              echo "Auto Merge detected, using main branch for E2E tests"
            fi
          fi

          # Trigger the E2E Tests workflow with local sandbox environment
          echo "Triggering E2E Tests workflow..."
          echo "Workflow file: e2e-tests.yml"
          echo "Branch: $HEAD_REF"
          echo "Environment: custom"
          echo "Custom URL: http://localhost:3000"
          
          # Check if workflow exists
          if ! gh workflow view e2e-tests.yml &>/dev/null; then
            echo "❌ Error: e2e-tests.yml workflow not found"
            echo "Available workflows:"
            gh workflow list
            echo ""
            echo "Note: The workflow file must exist on the default branch (main) to be triggered."
            exit 1
          fi
          
          # Trigger the workflow
          if gh workflow run e2e-tests.yml \
            --field environment="custom" \
            --field custom_url="http://localhost:3000" \
            --ref $HEAD_REF; then
            echo "✅ E2E Tests workflow triggered successfully"
            echo "You can view the run at: https://github.com/${{ github.repository }}/actions"
          else
            echo "❌ Failed to trigger E2E Tests workflow"
            echo "Exit code: $?"
            echo ""
            echo "Troubleshooting:"
            echo "1. Ensure e2e-tests.yml exists on the default branch (main)"
            echo "2. Check that the workflow has workflow_dispatch enabled"
            echo "3. Verify GITHUB_TOKEN has actions:write permission"
            echo ""
            echo "Available workflows:"
            gh workflow list
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord notification
        if: failure()
        uses: ./.github/actions/discord-notification
        with:
          webhook_url: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          workflow_name: ${{ github.workflow }}
          job_status: ${{ job.status }}
          run_id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          ref_name: ${{ github.ref_name }}
          event_name: ${{ github.event_name }}
          head_commit_message: ${{ github.event.pull_request.title || 'Test workflow' }}
          pull_request_number: ${{ github.event.pull_request.number || '' }}
          pull_request_title: ${{ github.event.pull_request.title || '' }}
          pull_request_url: ${{ github.event.pull_request.html_url || '' }}
